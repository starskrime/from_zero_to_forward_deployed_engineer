<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FDE Preparation</title>
  <meta name="description" content="A self-study platform for becoming a Forward Deployed Engineer: 27 weeks, 10 portfolio projects.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316191f'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='800' font-size='11' fill='white' text-anchor='middle'%3EFDE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/platform.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="wrap" id="home">
    <!-- Hero: greeting + today's session -->
    <section class="hero">
      <div class="card hero-greeting">
        <div class="eyebrow" id="hero-eyebrow">Forward Deployed Engineer · Self-study</div>
        <h1 id="greeting">Welcome</h1>
        <p id="hero-status"></p>
        <div class="bar" aria-hidden="true"><span id="overall-bar" style="width:0"></span></div>
        <p class="small muted" style="margin:8px 0 0" id="overall-text"></p>
      </div>
      <div class="card today-card" id="today-card"></div>
    </section>

    <!-- Stats -->
    <section class="section" style="margin-top:16px">
      <div class="grid grid-4" id="stats"></div>
    </section>

    <!-- Journey ribbon -->
    <section class="section">
      <div class="section-head">
        <h2>Your journey</h2>
        <a href="plan.html#timeline" class="small">Open full plan →</a>
      </div>
      <div class="card">
        <div class="ribbon" id="ribbon"></div>
        <div class="legend" id="legend"></div>
      </div>
    </section>

    <!-- This week + setup -->
    <section class="section">
      <div class="grid grid-2">
        <div class="card" id="this-week"></div>
        <div class="card" id="setup-card"></div>
      </div>
    </section>

    <!-- Projects -->
    <section class="section">
      <div class="section-head">
        <h2>Your 10 portfolio projects</h2>
        <a href="plan.html#projects" class="small">Details and status →</a>
      </div>
      <div class="grid grid-3" id="projects"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/curriculum.js"></script>
  <script src="assets/js/tracks.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
